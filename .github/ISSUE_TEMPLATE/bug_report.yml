name: Bug Report
description: 报告一个 bug
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: "1. 上传 XLSX\n2. 点击「加入研究」\n3. 看到……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包括错误信息、控制台日志等
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器与版本、Node 版本、运行模式（dev/build/生产）
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 相关日志片段。**删除其中的密钥 / Token / 访问密码。**
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已删除日志中的密钥 / Token / 访问密码
          required: true
