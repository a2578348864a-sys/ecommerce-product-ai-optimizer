# V3.1 Phase 3 — Nginx site template (deployed at /etc/nginx/sites-available/alibaba-ai-assistant)
# NOTE: THIS FILE IS A TEMPLATE FOR REPRODUCIBILITY. Do NOT commit live secrets/cert paths' content.
# Certificates are referenced by LE live paths and must NEVER be committed.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # V3.1 Phase 3: ACME webroot (never proxied to app)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # HTTP -> HTTPS (fixed scheme; no open redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 112.124.54.81;

    ssl_certificate /etc/letsencrypt/live/112.124.54.81/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/112.124.54.81/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    # V3.1 Phase 3: edge burst guard on high-risk provider paths.
    # Nginx = VOLUMETRIC BURST PROTECTION only; guest quota / global cap / IP backstop stay app-authoritative.
    location = /api/auth/guest {
        limit_req zone=guest_burst burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/workflows/product-analysis {
        limit_req zone=guest_burst burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 210s;
    }

    location ~ ^/api/tasks/[A-Za-z0-9_-]+/(listing-handoff|image-handoff|image-draft)$ {
        limit_req zone=guest_burst burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_connect_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
