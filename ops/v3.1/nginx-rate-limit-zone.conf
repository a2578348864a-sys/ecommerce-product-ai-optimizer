# V3.1 Phase 3 — Nginx volumetric burst guard zone (deployed at /etc/nginx/conf.d/v31-rate-limit.conf)
# Thresholds are GENEROUS (normal HR + shared NAT never hit them). NOT product quota.
limit_req_zone $binary_remote_addr zone=guest_burst:10m rate=20r/m;
limit_req_dry_run off;
limit_req_status 429;
